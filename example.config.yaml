# config.yaml
general:
  backup_source_base_path: /tmp/backup-source-folder
  backup_target_base_path: /tmp/backup-target-folder
  log_level: INFO
  notification_email: your_email@domain.com

gitlab:
  url: https://gitlab.com/
  token: your_secure_token
  group: yout_gitlab_group
  include_subgroups: true
  per_page: 100
  clone_all_branches: true

# Map repositories to their databases
# Format: "relative/path/to/repo": "rds_instance_id.database_name"
# Path is relative to the root group specified above
repository_to_db_mapping:
  "backend/api-service": "pgprod01.main_db"
  "backend/auth-service": "pgprod01.auth_db"
  "frontend/web-app": "mssqlprod01.users"

# Optional: Override backup folder structure
# Format: "gitlab/path/to/repo": "backup/custom/path"
backup_path_overrides:
  "legacy/old-service": "archive/legacy/old-service"

alibaba:
  access_key_id: ALIBABA_ACCESS_KEY
  access_key_secret: ALIBABA_ACCESS_SECRET
  region: cn-hangzhou

databases:
  backup_username: backup_reader
  backup_password: DB_BACKUP_PASSWORD

  rds_instances:
    - id: pgprod01
      engine: postgresql
      endpoint: pgprod.rds.aliyuncs.com:5432
      databases: ['gamedb', 'analytics']

    - id: mssqlprod01
      engine: mssql
      endpoint: mssql.rds.aliyuncs.com:1433
      databases: ['transactions', 'users']

    - id: mysqlprod01
      engine: mysql
      endpoint: mysql.rds.aliyuncs.com:3306
      databases: all  # Backs up all databases

  external_databases:
    - id: mongodb_atlas
      type: mongodb
      connection_string: MONGODB_URI
      databases: ['game_state', 'player_profiles']

    - id: redis_cloud
      type: redis
      endpoint: redis-12345.c1.us-east-1.aws.cloud.redislabs.com:12345
      password: REDIS_PASSWORD

encryption:
  method: shamir  # Shamir's Secret Sharing
  total_shares: 3
  threshold: 2
  share_locations:
    - type: vault
      url: https://vault.yourcompany.com
      path: /secret/dr-keys
    - type: aws_secrets
      region: us-east-1
      secret_name: dr-backup-share-2
    - type: azure_keyvault
      vault_name: tgc-keyvault
      secret_name: dr-share-3
    - type: local_disk
      path: /tmp/backup/shares1
      description: "Local secure disk 1"
    - type: offline
      description: "Physical safe - Office A"
    - type: offline
      description: "Safety deposit box - Bank B"
    - type: email
      name: "John Doe"
      address: "john.doe@example.com"
      description: "CTO - Shareholder 3"

storage:
  primary:
    type: s3
    endpoint: https://minio.yourcompany.local
    bucket: dr-backups
    access_key: MINIO_ACCESS_KEY
    secret_key: MINIO_SECRET_KEY
    write_only: true

  secondary:
    type: azure_blob
    account_name: tgcbackups
    container: disaster-recovery
    sas_token: AZURE_SAS_TOKEN